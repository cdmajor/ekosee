<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ekosee</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon32.png" alt="" class="logo-img" />
        <span class="logo-name">Ekosee</span>
      </div>
    </header>

    <div class="body">
      <div class="hint">
        <div class="hint-icon">🌐</div>
        <p class="hint-text">Look for the <strong>Translate</strong> pill in the bottom-right corner of any page.</p>
      </div>

      <div id="statusRow" class="status-row hidden">
        <span id="statusDot" class="dot"></span>
        <span id="statusText" class="status-text"></span>
      </div>

      <button id="restoreBtn" class="btn btn--ghost hidden">
        Restore Original
      </button>
    </div>

    <footer class="footer">
      <button id="settingsBtn" class="footer-link">Settings</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
