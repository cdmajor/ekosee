<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ekosee demo — foreign sites</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #c8d0da;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }
  body.pc { background: #1a2332; }
  .desktop {
    width: 1180px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.35);
    background: #0b1220;
  }
  body.pc .desktop { border-radius: 8px; }
  .menubar {
    height: 28px;
    background: linear-gradient(180deg, #ececec, #d8d8d8);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 14px;
    color: #222;
    font-size: 12px;
  }
  .menubar.hidden { display: none; }
  .menubar .apple { font-weight: 700; }
  .menubar .app { font-weight: 600; }
  .titlebar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .titlebar.safari { background: #2a2a2c; }
  .titlebar.chrome { background: #202124; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .traffic { display: flex; gap: 7px; flex-shrink: 0; }
  .traffic span { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .traffic .r { background: #ff5f57; }
  .traffic .y { background: #febc2e; }
  .traffic .g { background: #28c840; }
  body.pc .traffic { display: none; }
  .tabs { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .tab {
    background: rgba(255,255,255,0.1);
    color: #e5e7eb;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 8px 8px 0 0;
    max-width: 360px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .win-controls {
    display: none;
    margin-left: auto;
    gap: 2px;
    align-items: center;
    flex-shrink: 0;
  }
  body.pc .win-controls { display: flex; }
  .win-controls span {
    width: 46px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: #e8eaed; font-size: 12px;
  }
  .omnibox {
    width: 100%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    color: #f8fafc;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .omnibox .lock { opacity: 0.85; font-size: 14px; }
  .omnibox #url {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .content {
    position: relative;
    background: #f8fafc;
    min-height: 640px;
    color: #0f172a;
  }
  .article {
    max-width: 760px;
    margin: 0 auto;
    padding: 44px 40px 130px;
  }
  .kicker {
    color: #b45309;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 36px;
    line-height: 1.18;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }
  .meta { color: #64748b; font-size: 14px; margin-bottom: 26px; }
  p { font-size: 18px; line-height: 1.65; color: #334155; margin-bottom: 16px; }
  .rtl { direction: rtl; text-align: right; }
  .pill {
    position: absolute;
    right: 28px;
    bottom: 28px;
    height: 42px;
    padding: 0 18px;
    border-radius: 999px;
    background: #C19A6B;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    border: none;
    font-family: inherit;
  }
  .pill.translated {
    background: #7B8F6A;
    padding-right: 8px;
  }
  .pill .restore {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    margin-left: 4px;
  }
  .panel {
    position: absolute;
    right: 28px;
    bottom: 86px;
    width: 240px;
    background: #1C1C1E;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px;
    color: #fff;
    box-shadow: 0 16px 48px rgba(0,0,0,0.45);
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700; margin-bottom: 12px;
  }
  .panel-label {
    font-size: 11px; color: rgba(255,255,255,0.4);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .select {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .translate-btn {
    width: 100%;
    background: #C19A6B;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    padding: 10px;
    font-size: 13px;
  }
  .label-tag {
    position: absolute;
    left: 20px; top: 20px;
    background: rgba(15,23,42,0.88);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 999px;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="desktop" id="frame">
    <div class="menubar" id="menubar">
      <span class="apple"></span>
      <span class="app">Safari</span>
      <span>File</span><span>Edit</span><span>View</span><span>History</span><span>Bookmarks</span><span>Develop</span><span>Window</span><span>Help</span>
    </div>
    <div class="titlebar" id="titlebar">
      <div class="row">
        <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <div class="tabs" id="tabs"></div>
        <div class="win-controls" aria-hidden="true"><span>─</span><span>□</span><span>×</span></div>
      </div>
      <div class="omnibox" id="omnibox"><span class="lock">🔒</span><span id="url"></span></div>
    </div>
    <div class="content" id="content"></div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const platform = params.get("platform") || "mac"; // mac | pc
  const scene = params.get("scene") || "mac1";

  const menubar = document.getElementById("menubar");
  const titlebar = document.getElementById("titlebar");
  const content = document.getElementById("content");
  const urlEl = document.getElementById("url");
  const tabs = document.getElementById("tabs");

  if (platform === "mac") {
    document.body.classList.remove("pc");
    menubar.classList.remove("hidden");
    titlebar.classList.add("safari");
    titlebar.classList.remove("chrome");
  } else {
    document.body.classList.add("pc");
    menubar.classList.add("hidden");
    titlebar.classList.add("chrome");
    titlebar.classList.remove("safari");
  }

  const platformTag = platform === "mac" ? "Mac · Safari" : "PC · Chrome";

  function page({ url, tab, kicker, title, meta, paragraphs, mode, lang, rtl }) {
    const bodyClass = rtl ? "article rtl" : "article";
    const paras = paragraphs.map((t) => `<p>${t}</p>`).join("");
    let chromeUI = `<button class="pill"><span>🌐</span><span>Translate</span></button>`;
    if (mode === "picker") {
      chromeUI = `
        <div class="panel">
          <div class="panel-head"><span>Translate page</span><span style="opacity:.5">✕</span></div>
          <div class="panel-label">Translate to</div>
          <div class="select">${lang || "English"} ▾</div>
          <button class="translate-btn">Translate</button>
        </div>
        <button class="pill"><span>🌐</span><span>Translate</span></button>`;
    } else if (mode === "translated") {
      chromeUI = `<button class="pill translated"><span>✓ ${lang || "English"}</span><span class="restore">↺</span></button>`;
    }
    return {
      url,
      tab,
      html: `
        <div class="label-tag">${platformTag}</div>
        <div class="${bodyClass}">
          <div class="kicker">${kicker}</div>
          <h1>${title}</h1>
          <div class="meta">${meta}</div>
          ${paras}
        </div>
        ${chromeUI}`
    };
  }

  // Mac: 4 foreign sites  |  PC: 4 different foreign sites
  const scenes = {
    // Mac 1 — French news, pill ready
    mac1: page({
      url: "https://www.lemonde.fr/international/article/sommet-europeen-bruxelles",
      tab: "Les dirigeants européens — Le Monde",
      kicker: "International",
      title: "Les dirigeants européens se réunissent à Bruxelles",
      meta: "Le Monde · Il y a 2 heures · lemonde.fr",
      paragraphs: [
        "Les chefs d'État et de gouvernement de l'Union européenne se retrouvent ce jeudi pour discuter de la sécurité et de l'énergie.",
        "Plusieurs capitales espèrent un accord sur de nouvelles mesures de soutien, tandis que d'autres appellent à la prudence budgétaire.",
        "À Bruxelles, les négociations devraient se prolonger jusqu'à la nuit."
      ],
      mode: "pill"
    }),
    // Mac 2 — Japanese news, picker open
    mac2: page({
      url: "https://www.asahi.com/articles/economy-summit-tokyo-2026.html",
      tab: "経済サミット — 朝日新聞",
      kicker: "経済",
      title: "東京で経済サミットが開幕、各国首脳が協力を確認",
      meta: "朝日新聞 · 3時間前 · asahi.com",
      paragraphs: [
        "世界各国の首都東京で経済サミットが始まり、貿易とエネルギー安全保障について議論が行われた。",
        "参加国はサプライチェーンの強化と気候変動対策で連携する方針を示した。",
        "閉幕は週末の予定で、共同声明の取りまとめが焦点となっている。"
      ],
      mode: "picker",
      lang: "English"
    }),
    // Mac 3 — German news, language picker
    mac3: page({
      url: "https://www.spiegel.de/politik/deutschland/bundestag-energiegesetz.html",
      tab: "Bundestag beschließt Energiegesetz — DER SPIEGEL",
      kicker: "Politik",
      title: "Bundestag beschließt neues Energiegesetz nach langer Debatte",
      meta: "DER SPIEGEL · vor 4 Stunden · spiegel.de",
      paragraphs: [
        "Nach stundenlanger Aussprache hat der Bundestag ein umfassendes Energiegesetz verabschiedet.",
        "Opposition kritisierte fehlende Entlastungen für Haushalte, die Koalition verwies auf Klimaziele.",
        "Das Gesetz soll bereits zum kommenden Quartal in Kraft treten."
      ],
      mode: "picker",
      lang: "English"
    }),
    // Mac 4 — Spanish news, translated to English
    mac4: page({
      url: "https://elpais.com/internacional/cumbre-clima-madrid.html",
      tab: "Climate summit — El País",
      kicker: "Internacional",
      title: "World leaders reach a climate agreement in Madrid",
      meta: "El País · 1 hour ago · elpais.com",
      paragraphs: [
        "Delegations from more than 100 countries signed a framework to cut emissions over the next decade.",
        "Negotiators highlighted funding for developing nations and new targets for renewable energy.",
        "Protests continued outside the venue as talks entered their final hours."
      ],
      mode: "translated",
      lang: "English"
    }),

    // PC 1 — Italian news, pill
    pc1: page({
      url: "https://www.corriere.it/esteri/vertice-ue-roma.shtml",
      tab: "Vertice UE a Roma — Corriere della Sera",
      kicker: "Esteri",
      title: "Vertice europeo a Roma: al centro sicurezza e migrazione",
      meta: "Corriere della Sera · 2 ore fa · corriere.it",
      paragraphs: [
        "I leader dell'Unione europea si sono riuniti a Roma per discutere di sicurezza comune e flussi migratori.",
        "Sul tavolo anche le nuove regole energetiche e il sostegno all'industria continentale.",
        "Le trattative potrebbero protrarsi fino a tarda sera."
      ],
      mode: "pill"
    }),
    // PC 2 — Portuguese (Brazil), picker
    pc2: page({
      url: "https://www1.folha.uol.com.br/mundo/cupula-amazonia-brasilia.shtml",
      tab: "Cúpula da Amazônia — Folha de S.Paulo",
      kicker: "Mundo",
      title: "Cúpula em Brasília discute proteção da Amazônia e financiamento verde",
      meta: "Folha de S.Paulo · há 5 horas · folha.uol.com.br",
      paragraphs: [
        "Representantes de vários países se reuniram em Brasília para negociar metas de conservação florestal.",
        "O encontro busca acordos sobre financiamento climático e combate ao desmatamento ilegal.",
        "Ativistas pediram prazos mais ambiciosos e fiscalização mais rígida."
      ],
      mode: "picker",
      lang: "English"
    }),
    // PC 3 — Arabic news, picker (RTL)
    pc3: page({
      url: "https://www.bbc.com/arabic/articles/middle-east-summit-cairo",
      tab: "قمة الشرق الأوسط — BBC News عربي",
      kicker: "الشرق الأوسط",
      title: "قادة المنطقة يجتمعون في القاهرة لبحث السلام والاقتصاد",
      meta: "BBC News عربي · منذ ساعتين · bbc.com/arabic",
      paragraphs: [
        "انطلقت أعمال القمة في القاهرة بمشاركة وفود من عدة دول لمناقشة ملفات السلام والاستقرار.",
        "وتشمل أجندة الاجتماع التعاون الاقتصادي ومشاريع الطاقة الإقليمية.",
        "ومن المتوقع أن تصدر بياناً مشتركاً بنهاية اليوم."
      ],
      mode: "picker",
      lang: "English",
      rtl: true
    }),
    // PC 4 — Korean news, translated
    pc4: page({
      url: "https://www.chosun.com/international/asia/seoul-summit-2026/",
      tab: "Seoul summit — The Chosun Ilbo",
      kicker: "국제",
      title: "Asian leaders agree on technology partnership in Seoul",
      meta: "The Chosun Ilbo · 3 hours ago · chosun.com",
      paragraphs: [
        "Officials from across the region announced a joint plan for semiconductor supply chains and AI research.",
        "The summit also covered climate resilience and youth exchange programs.",
        "A final communiqué is expected tomorrow morning."
      ],
      mode: "translated",
      lang: "English"
    }),
  };

  // Map legacy/generic scene names used by capture script
  const alias = {
    landing: platform === "mac" ? "mac1" : "pc1",
    install: platform === "mac" ? "mac2" : "pc2",
    picker: platform === "mac" ? "mac3" : "pc3",
    translated: platform === "mac" ? "mac4" : "pc4",
    "1": platform === "mac" ? "mac1" : "pc1",
    "2": platform === "mac" ? "mac2" : "pc2",
    "3": platform === "mac" ? "mac3" : "pc3",
    "4": platform === "mac" ? "mac4" : "pc4",
  };

  const key = scenes[scene] ? scene : (alias[scene] || (platform === "mac" ? "mac1" : "pc1"));
  const s = scenes[key];
  urlEl.textContent = s.url;
  tabs.innerHTML = `<div class="tab">${s.tab}</div>`;
  content.innerHTML = s.html;
</script>
</body>
</html>
